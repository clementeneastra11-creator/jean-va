<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jean, Virtual Assistant</title><meta name="claude:viewport-fit-sides" content="cover"><link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap"><style id="app-style">
/* Layout: a warm sand hero band (headline, portrait, at-a-glance card) over cream content sections.
   Palette is drawn from the portrait: tan backdrop, cream suit, espresso hair. Bronze is the only accent. */
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --ink:#2A1F18; --muted:#6B5A4E; --line:#E6DACD;
  --accent:#8B5A3C; --accent-ink:#FFFFFF; --tint:#F3E9DE;
  --hero-bg:#D9C5B0; --hero-fg:#2A1F18; --hero-muted:#5A483B; --hero-line:#B9A08A; --hero-accent:#6B4128;
  --hero-btn-bg:#2A1F18; --hero-btn-fg:#FAF6F1; --portrait-bg:#C9AE96;
  --bar-accent:#E3B98F; --bar-accent-ink:#2A1F18;
  --scrim:rgba(34,22,14,.66);
  --edit:#B45309; --edit-bg:#FFF4E5; --danger:#B42318; --ok:#1B7F4B;
  --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17110C; --surface:#221A13; --ink:#F3EADF; --muted:#BFAC9B; --line:#3B2F25;
    --accent:#DDAE80; --accent-ink:#2A1608; --tint:#2E241B;
    --hero-bg:#261C14; --hero-fg:#F6EEE4; --hero-muted:#CDBBAA; --hero-line:#4C3C2F; --hero-accent:#E3B98F;
    --hero-btn-bg:#E3B98F; --hero-btn-fg:#2A1608; --portrait-bg:#3A2C21;
    --bar-accent:#E3B98F; --bar-accent-ink:#2A1F18;
    --edit:#FBBF24; --edit-bg:#2B2008; --danger:#F97066; --ok:#4ADE80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17110C; --surface:#221A13; --ink:#F3EADF; --muted:#BFAC9B; --line:#3B2F25;
  --accent:#DDAE80; --accent-ink:#2A1608; --tint:#2E241B;
  --hero-bg:#261C14; --hero-fg:#F6EEE4; --hero-muted:#CDBBAA; --hero-line:#4C3C2F; --hero-accent:#E3B98F;
  --hero-btn-bg:#E3B98F; --hero-btn-fg:#2A1608; --portrait-bg:#3A2C21;
  --bar-accent:#E3B98F; --bar-accent-ink:#2A1F18;
  --edit:#FBBF24; --edit-bg:#2B2008; --danger:#F97066; --ok:#4ADE80;
  color-scheme:dark;
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:clamp(1.65rem,3vw,2.15rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero :focus-visible{outline-color:var(--hero-accent)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font:500 .75rem/1.3 var(--font-mono);letter-spacing:.09em;text-transform:uppercase}
.muted{color:var(--muted)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.mark{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:800 1.1rem var(--font-display);flex:none}
.brand b{display:block;font:700 1rem/1.2 var(--font-display)}
.brand span.sub{display:block;font:500 .72rem/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.nav a{padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--tint)}
.nav a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.hdr-actions{display:flex;gap:8px;align-items:center}
@media (max-width:820px){.nav{order:3;width:100%;margin-left:0}.hdr-actions{margin-left:auto}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:8px;font:600 .95rem/1.2 var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.6;cursor:default}

/* Hero */
.hero{background:var(--hero-bg);color:var(--hero-fg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:56px;padding-block:72px 80px;align-items:center}
.roles{display:flex;flex-wrap:wrap;gap:6px 0;color:var(--hero-accent);margin-bottom:22px}
.roles>*+*::before{content:"|";margin:0 12px;color:var(--hero-line)}
.hero h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:22px}
.hero .lead{font-size:1.15rem;color:var(--hero-fg);max-width:52ch;margin-bottom:14px}
.hero .goal{color:var(--hero-muted);max-width:56ch;margin-bottom:32px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.primary{background:var(--hero-btn-bg);color:var(--hero-btn-fg);border-color:transparent}
.hero .btn.ghost{color:var(--hero-fg);border-color:var(--hero-line)}
.hero .btn.ghost:hover{border-color:var(--hero-accent)}
.portrait{position:relative;aspect-ratio:4/5;border:1px solid var(--hero-line);border-radius:12px;overflow:hidden;background:var(--portrait-bg);display:grid;place-items:center}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait .mono-initial{font:800 7rem/1 var(--font-display);color:var(--hero-accent);opacity:.35}
.img-tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:3}
.glance{margin-top:-28px;margin-left:20px;margin-right:-4px;position:relative;z-index:2;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.glance .who{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.glance .who b{font:800 1.2rem/1.2 var(--font-display)}
.glance dl{margin:0;display:grid;gap:10px}
.glance dt{color:var(--muted)}
.glance dd{margin:0;font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:36px;padding-block:48px 56px}.portrait{max-width:380px}.glance{margin-left:0;margin-right:0;max-width:380px}}

/* Sections */
.sec{padding-block:84px}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:grid;gap:10px;margin-bottom:40px;max-width:62ch}
.sec-head .mono{color:var(--accent)}
.sec-head p{color:var(--muted)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.sec.alt .card{background:var(--bg)}

/* About */
.about-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px}
.about-copy{display:grid;gap:18px;max-width:64ch}
.about-copy p{color:var(--muted)}
.about-copy p:first-child{color:var(--ink);font-size:1.2rem;line-height:1.55}
.values{display:grid;gap:0;margin-top:8px}
.value{padding:16px 0;border-top:1px solid var(--line);position:relative}
.value:last-child{border-bottom:1px solid var(--line)}
.value b{display:block;font:700 1rem var(--font-display)}
.value span{color:var(--muted);font-size:.93rem}
@media (max-width:860px){.about-grid{grid-template-columns:minmax(0,1fr);gap:32px}}

/* Services */
.svc{padding:26px;display:flex;flex-direction:column;gap:12px;position:relative}
.svc .ic{width:42px;height:42px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.svc .ic svg{width:22px;height:22px}
.svc p{color:var(--muted);font-size:.95rem}
.svc ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-size:.93rem}
.svc li{display:flex;gap:10px;align-items:flex-start;position:relative}
.svc li::before{content:"";flex:none;width:7px;height:7px;margin-top:.55em;border-radius:2px;background:var(--accent)}
.tools{margin-top:44px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 .9rem var(--font-body);color:var(--ink);cursor:default}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Work */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.work{overflow:hidden;position:relative;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.work:hover{border-color:var(--accent)}
.work img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.ph{background:var(--tint);color:var(--accent);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.ph svg{width:62%;height:auto}
.work .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.work .meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--accent)}
.tag-sample{font:500 .68rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:4px}
.work p{color:var(--muted);font-size:.93rem}
.hit{all:unset;cursor:pointer;font:700 1.1rem/1.25 var(--font-display);color:var(--ink)}
.hit::after{content:"";position:absolute;inset:0}
.hit:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.more{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:600;font-size:.9rem}
.more::after{content:" \2192"}
.card-tools{display:flex;gap:8px;margin-top:auto;padding-top:8px;position:relative;z-index:2}
.add-card{min-height:160px;border:1.5px dashed var(--edit);background:transparent;color:var(--edit);border-radius:10px;cursor:pointer;font-weight:600}
.empty{color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:10px}

/* Modal */
.overlay{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{position:relative;background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:820px;overflow:hidden;border:1px solid var(--line)}
.dialog .media{position:relative}
.dialog .media img,.dialog .media .ph{aspect-ratio:16/9}
.dialog .content{padding:28px;display:grid;gap:18px}
.dialog h2{font-size:1.7rem}
.dialog h4{margin:0 0 4px;font:500 .72rem var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.dialog p{color:var(--muted);white-space:pre-line}
.dialog .x{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
.dialog-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;counter-reset:s}
.step{padding:0 28px 0 0;position:relative}
.step .n{font:500 .78rem var(--font-mono);letter-spacing:.08em;color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.step .n::after{content:"";flex:1;height:1px;background:var(--line)}
.step p{color:var(--muted);font-size:.95rem;margin-top:8px}
.step .del{margin-top:10px}

/* Testimonials */
.quote{padding:26px;display:flex;flex-direction:column;gap:16px}
.quote blockquote{margin:0;font-size:1.05rem;line-height:1.6}
.quote figcaption b{display:block;font-weight:600}
.quote figcaption span{color:var(--muted);font-size:.9rem}

/* FAQ */
.faq{display:grid;gap:0;max-width:820px}
.faq details,.faq .qa{border-top:1px solid var(--line);padding:4px 0}
.faq details:last-child,.faq .qa:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:16px 36px 16px 0;font:700 1.02rem var(--font-display);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font:400 1.5rem var(--font-body);color:var(--accent)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 36px 18px 0;color:var(--muted);white-space:pre-line}
.faq .qa{padding:14px 0;display:grid;gap:6px}
.faq .qa h3{font-size:1.02rem}
.faq .qa p{color:var(--muted)}

/* Contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:start}
.contact-copy{display:grid;gap:18px}
.contact-copy>p{color:var(--muted);max-width:48ch}
.rows{display:grid;gap:0;margin-top:6px}
.row{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row .mono{color:var(--muted)}
.row .val{overflow-wrap:anywhere;font-weight:500}
.builder{padding:26px;display:grid;gap:16px}
.builder h3{font-size:1.2rem}
.field{display:grid;gap:6px}
.field label,.field .lbl{font:500 .72rem var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.field textarea{min-height:84px;resize:vertical}
.preview{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.builder-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:860px){.contact-grid{grid-template-columns:minmax(0,1fr);gap:32px}.row{grid-template-columns:minmax(0,1fr) auto}.row .mono{grid-column:1/-1}}

/* Footer */
.ftr{padding-block:32px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.ftr .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

/* Editing */
body.editing{padding-bottom:140px}
.editing [contenteditable]{outline:1px dashed var(--edit);outline-offset:3px;border-radius:3px;cursor:text;min-width:2ch}
.editing [contenteditable]:hover{background:var(--edit-bg)}
.editing [contenteditable]:focus{outline:2px solid var(--edit);background:var(--edit-bg)}
.editing [contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.8}
.editing .hero [contenteditable]{outline-color:var(--edit)}
.editing .hero [contenteditable]:hover,.editing .hero [contenteditable]:focus{background:var(--edit-bg);outline-color:var(--edit)}
[contenteditable]{white-space:pre-line}
.mini{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--danger);cursor:pointer;font-size:.9rem;line-height:1;padding:0;flex:none}
.mini.add{color:var(--edit);border-color:var(--edit);width:auto;border-radius:6px;padding:4px 10px;height:auto;font-size:.82rem;font-weight:600}
.item-tools{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill-edit{font:500 .72rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--edit);border:1px solid var(--edit);padding:4px 10px;border-radius:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ink);color:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1120px;margin:0 auto;display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar-main{display:grid;gap:2px;min-width:0}
.bar-main b{font:700 .95rem var(--font-display)}
.bar-main span{font-size:.85rem;opacity:.8}
.checks{list-style:none;margin:0;padding:0;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem}
.checks li{display:flex;gap:6px;align-items:center;opacity:.75}
.checks li.ok{opacity:1}
.checks li::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.checks li.ok::before{background:#4ADE80;border-color:#4ADE80}
.bar-btns{display:flex;gap:8px}
.bar .btn.ghost{color:var(--surface);border-color:rgba(255,255,255,.35)}
.bar .btn.primary{background:var(--bar-accent);color:var(--bar-accent-ink);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---------- Scroll spy ---------- */
var io=null;
function observe(){
  if(!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        activeSec=e.target.id;
        document.querySelectorAll('.nav a').forEach(function(a){
          var on=a.getAttribute('href')==='#'+activeSec;
          a.classList.toggle('on',on);
          if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');
        });
      }
    });
  },{rootMargin:'-35% 0px -60% 0px'});
  document.querySelectorAll('main section[id]').forEach(function(s){io.observe(s)});
}

var toastT=0;
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show')},2600)}
function copyText(t){
  function fb(){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);toast(ok?'Copied':'Select the text and copy it manually')}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copied')},fb);return}}catch(e){}
  fb();
}
function fileToData(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'))};
    im.src=url;
  });
}
function pickImage(path,max){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    fileToData(f,max,0.82).then(function(d){setP(path,d);if(modalIdx>=0)renderModal();render()},function(){toast('That file could not be read as an image')});
  };
  inp.click();
}

function findReset(){
  try{var ss=document.head.querySelectorAll('style');for(var i=0;i<ss.length;i++){if(ss[i].id!=='app-style'&&/safe-area-inset/.test(ss[i].textContent))return ss[i].textContent}}catch(e){}
  return FALLBACK_RESET;
}
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+findReset()+'</style></head><body>'

    +'</body></html>';

function save(){
  if(!ART||saving)return;
  saving=true;renderBar();
  var done=function(){saving=false;renderBar()};
  var p;
  try{p=ART.publish(buildDoc())}catch(e){p=Promise.reject({code:'upstream_error'})}
  p.then(function(){toast('Saved. Reloading your live page...')},function(err){
    done();
    var c=err&&err.code;
    if(c==='conflict')toast('A newer version was just saved. Reloading it now.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){canEdit=false;editing=false;S=clone(ORIG);render();toast('This view is read-only, so changes cannot be saved.')}
    else if(c==='too_large')toast('The page is too large to save. Try smaller images.');
    else if(c==='rate_limited')toast('Saving too often. Wait a moment and try again.');
    else toast('Could not save. Your edits are still here. Try again.');
  });
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]');
  if(!t)return;
  var a=t.dataset.act;
  if(a==='close'){if(e.target!==t&&!t.classList.contains('x'))return;closeModal();return}
  if(a==='open'){openWork(+t.dataset.i);return}
  if(a==='filter'){cat=t.dataset.cat;renderWork();return}
  if(a==='edit'){editing=true;render();return}
  if(a==='discard'){S=clone(ORIG);editing=false;modalIdx=-1;renderModal();render();return}
  if(a==='save'){save();return}
  if(a==='img'){pickImage(t.dataset.p,+t.dataset.max||1200);return}
  if(a==='img-clear'){setP(t.dataset.p,'');if(modalIdx>=0)renderModal();render();return}
  if(a==='sample'){var w=S.work[+t.dataset.i];w.sample=!w.sample;renderModal();render();return}
  if(a==='add'){
    var list=getP(t.dataset.list),k=t.dataset.kind;
    list.push(TPL[k]());
    if(t.dataset.list==='work'){render();openWork(list.length-1);return}
    if(t.dataset.list.indexOf('work.')===0){renderModal();return}
    render();return;
  }
  if(a==='del'){
    if(t.dataset.confirm&&!t.dataset.armed){
      t.dataset.armed='1';var old=t.innerHTML;t.textContent='Click again to confirm';
      setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.innerHTML=old}},3000);return;
    }
    getP(t.dataset.list).splice(+t.dataset.i,1);
    if(t.dataset.list.indexOf('work.')===0)renderModal();
    render();return;
  }
  if(a==='copy'){var v=(S.contact.items[+t.dataset.i].value||'').trim();if(v)copyText(v);return}
  if(a==='copymsg'){copyText(msg());return}
  if(a==='bsel'){
    var i=+t.dataset.i,ix=B.sel.indexOf(i);
    if(ix>=0)B.sel.splice(ix,1);else B.sel.push(i);
    t.classList.toggle('on',ix<0);t.setAttribute('aria-pressed',ix<0);refreshBuilder();return;
  }
});

  else if(el.id==='b-notes'){B.notes=el.value;refreshBuilder()}
});
document.addEventListener('change',function(e){if(e.target.id==='b-when'){B.when=e.target.value;refreshBuilder()}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modalIdx>=0){closeModal();return}
  var el=e.target;
  if(e.key==='Enter'&&el.hasAttribute&&el.hasAttribute('data-single')&&el.isContentEditable){e.preventDefault()}
});
document.addEventListener('paste',function(e){
  var el=e.target.closest&&e.target.closest('[contenteditable]');
  if(!el)return;
  e.preventDefault();
  var t=((e.clipboardData||window.clipboardData).getData('text/plain')||'');
  if(el.hasAttribute('data-single'))t=t.replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,t);
});

/* ---------- Start ---------- */
render();
(function init(){
  var c=window.claude;
  if(!c||!c.use)return;
  Promise.all([c.use('user'),c.use('artifact')]).then(function(r){
    var u=r[0];ART=r[1];
    if(!u||!ART)return null;
    return u.canEdit();
  }).then(function(ok){
    if(ok&&ART){canEdit=true;render()}
  }).catch(function(){});
})();
})();
</script>
